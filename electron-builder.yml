appId: com.example.bakpro
# 앱 번들·헬퍼 이름이 한글이면 macOS 에서 시작하자마자 죽으므로 파일 이름은 영문으로 두고,
# Finder·Dock 에 보이는 이름은 CFBundleDisplayName 으로 박프로라고 쓴다 (CFBundleName 도 헬퍼를 찾는 데 쓰여 영문이어야 한다)
productName: Bakpro
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/node-pty/**
  - node_modules/@anthropic-ai/**
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  # Developer ID 인증서가 없어 애드혹 서명만 한다 (공증 없음)
  identity: '-'
  hardenedRuntime: false
  artifactName: Bakpro-${version}-${arch}.${ext}
  extendInfo:
    CFBundleDevelopmentRegion: ko
    CFBundleDisplayName: 박프로
win:
  target:
    - target: nsis
      arch: x64
  # 코드 서명 인증서가 없어 서명하지 않는다 (처음 실행 시 SmartScreen 경고)
  artifactName: Bakpro-${version}-${arch}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: 박프로
  uninstallDisplayName: 박프로
